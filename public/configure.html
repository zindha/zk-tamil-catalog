<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZK Tamil Catalog - Configuration</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    
    .container {
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      max-width: 500px;
      width: 100%;
      padding: 40px;
    }
    
    .logo {
      text-align: center;
      margin-bottom: 30px;
    }
    
    .logo h1 {
      color: #667eea;
      font-size: 2rem;
      margin-bottom: 5px;
    }
    
    .logo p {
      color: #666;
      font-size: 0.9rem;
    }
    
    .form-group {
      margin-bottom: 25px;
    }
    
    label {
      display: block;
      margin-bottom: 8px;
      color: #333;
      font-weight: 600;
      font-size: 0.9rem;
    }
    
    input[type="text"],
    input[type="number"] {
      width: 100%;
      padding: 12px 15px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 1rem;
      transition: border-color 0.3s;
    }
    
    input[type="text"]:focus,
    input[type="number"]:focus {
      outline: none;
      border-color: #667eea;
    }
    
    .toggle-group {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    
    .toggle-switch {
      position: relative;
      width: 60px;
      height: 30px;
    }
    
    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #ccc;
      transition: 0.4s;
      border-radius: 30px;
    }
    
    .slider:before {
      position: absolute;
      content: "";
      height: 22px;
      width: 22px;
      left: 4px;
      bottom: 4px;
      background-color: white;
      transition: 0.4s;
      border-radius: 50%;
    }
    
    input:checked + .slider {
      background-color: #667eea;
    }
    
    input:checked + .slider:before {
      transform: translateX(30px);
    }
    
    .install-btn {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    
    .install-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
    }
    
    .install-btn:active {
      transform: translateY(0);
    }
    
    .info {
      margin-top: 20px;
      padding: 15px;
      background: #f5f5f5;
      border-radius: 10px;
      font-size: 0.85rem;
      color: #666;
    }
    
    .info a {
      color: #667eea;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <h1>🎬 ZK Tamil Catalog</h1>
      <p>Configure your Tamil movie catalog</p>
    </div>
    
    <form id="configForm">
      <div class="form-group">
        <label for="apiKey">TMDB API Key *</label>
        <input type="text" id="apiKey" placeholder="Enter your TMDB API key" required>
      </div>
      
      <div class="form-group">
        <label for="cacheDuration">Cache Duration (seconds)</label>
        <input type="number" id="cacheDuration" value="3600" min="300">
      </div>
      
      <div class="form-group">
        <div class="toggle-group">
          <label>Include Dubbed Movies</label>
          <label class="toggle-switch">
            <input type="checkbox" id="includeDubbed" checked>
            <span class="slider"></span>
          </label>
        </div>
      </div>
      
      <button type="submit" class="install-btn">
        📦 Install to Stremio
      </button>
    </form>
    
    <div class="info">
      <strong>ℹ️ How to get TMDB API Key:</strong><br>
      1. Go to <a href="https://www.themoviedb.org/settings/api" target="_blank">TMDB API Settings</a><br>
      2. Sign up/Login and request an API key<br>
      3. Copy and paste it above
    </div>
  </div>
  
  <script>
    document.getElementById('configForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const config = {
        apiKey: document.getElementById('apiKey').value,
        cacheDuration: parseInt(document.getElementById('cacheDuration').value),
        includeDubbed: document.getElementById('includeDubbed').checked
      };
      
      const encodedConfig = btoa(JSON.stringify(config));
      const workerUrl = window.location.origin;
      const manifestUrl = `${workerUrl}/${encodedConfig}/manifest.json`;
      
      // Open Stremio with the addon
      window.location.href = `stremio://${manifestUrl.replace('https://', '')}`;
    });
  </script>
</body>
</html>
