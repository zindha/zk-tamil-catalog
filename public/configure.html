<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZK Tamil Catalog - Configuration</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    
    .success-section {
      display: none;
      margin-top: 20px;
      padding: 20px;
      background: #f0fdf4;
      border: 2px solid #86efac;
      border-radius: 10px;
    }
    
    .success-section.show {
      display: block;
    }
    
    .manifest-url {
      background: white;
      padding: 12px;
      border-radius: 8px;
      word-break: break-all;
      font-size: 0.85rem;
      font-family: monospace;
      margin: 10px 0;
      border: 1px solid #d1d5db;
    }
    
    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }
    
    .copy-btn, .open-btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      font-size: 0.95rem;
    }
    
    .copy-btn {
      background: #667eea;
      color: white;
    }
    
    .copy-btn:hover {
      background: #5568d3;
      transform: translateY(-2px);
    }
    
    .copy-btn.copied {
      background: #10b981;
    }
    
    .open-btn {
      background: #764ba2;
      color: white;
    }
    
    .open-btn:hover {
      background: #653a8a;
      transform: translateY(-2px);
    }
    
    .back-link {
      display: inline-block;
      margin-bottom: 20px;
      color: #667eea;
      text-decoration: none;
      font-weight: 600;
    }
    
    .back-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="/" class="back-link">← Back to Home</a>
    
    <div class="logo">
      <h1>🎬 ZK Tamil Catalog</h1>
      <p>Configure your Tamil movie catalog</p>
    </div>
    
    <form id="configForm">
      <div class="form-group">
        <label for="apiKey">TMDB API Key *</label>
        <input type="text" id="apiKey" placeholder="Enter your TMDB API key" required>
      </div>
      
      <div class="form-group">
        <label for="cacheDuration">Cache Duration (seconds)</label>
        <input type="number" id="cacheDuration" value="3600" min="300">
      </div>
      
      <div class="form-group">
        <div class="toggle-group">
          <label>Include Dubbed Movies</label>
          <label class="toggle-switch">
            <input type="checkbox" id="includeDubbed" checked>
            <span class="slider"></span>
          </label>
        </div>
      </div>
      
      <button type="submit" class="install-btn">
        📦 Generate Install Link
      </button>
    </form>
    
    <div id="successSection" class="success-section">
      <strong>✅ Configuration Ready!</strong>
      <p style="margin: 10px 0; color: #059669;">Your addon manifest URL:</p>
      <div class="manifest-url" id="manifestUrl"></div>
      
      <div class="button-group">
        <button class="copy-btn" id="copyBtn">
          📋 Copy Link
        </button>
        <button class="open-btn" id="openBtn">
          🚀 Install to Stremio
        </button>
      </div>
    </div>
    
    <div class="info">
      <strong>ℹ️ How to get TMDB API Key:</strong><br>
      1. Go to <a href="https://www.themoviedb.org/settings/api" target="_blank">TMDB API Settings</a><br>
      2. Sign up/Login and request an API key<br>
      3. Copy and paste it above
    </div>
  </div>
  
  <script>
    let manifestUrl = '';
    
    document.getElementById('configForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const config = {
        apiKey: document.getElementById('apiKey').value,
        cacheDuration: parseInt(document.getElementById('cacheDuration').value),
        includeDubbed: document.getElementById('includeDubbed').checked
      };
      
      const encodedConfig = btoa(JSON.stringify(config));
      const workerUrl = window.location.origin;
      manifestUrl = `${workerUrl}/${encodedConfig}/manifest.json`;
      
      // Show success section
      document.getElementById('successSection').classList.add('show');
      document.getElementById('manifestUrl').textContent = manifestUrl;
      
      // Scroll to success section
      document.getElementById('successSection').scrollIntoView({ behavior: 'smooth' });
    });
    
    // Copy to clipboard
    document.getElementById('copyBtn').addEventListener('click', async function() {
      try {
        await navigator.clipboard.writeText(manifestUrl);
        const btn = this;
        const originalText = btn.innerHTML;
        btn.innerHTML = '✓ Copied!';
        btn.classList.add('copied');
        
        setTimeout(() => {
          btn.innerHTML = originalText;
          btn.classList.remove('copied');
        }, 2000);
      } catch (err) {
        // Fallback for older browsers
        const textArea = document.createElement('textarea');
        textArea.value = manifestUrl;
        document.body.appendChild(textArea);
        textArea.select();
        document.execCommand('copy');
        document.body.removeChild(textArea);
        
        alert('Link copied to clipboard!');
      }
    });
    
    // Open in Stremio
    document.getElementById('openBtn').addEventListener('click', function() {
      window.location.href = `stremio://${manifestUrl.replace('https://', '')}`;
    });
  </script>
</body>
</html>
